<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="#3b5e34" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- 底辺のベースライン -->
  <line x1="8" y1="56" x2="56" y2="56" />
  
  <!-- 外側の大きな三角（山 / テント外枠） -->

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>くじやまフィールド | 合同会社くじやま</title>
  <style>
    /* 全体基本スタイル */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      color: #333333;
      background-color: #f7f9f6;
    }
    header {
      background-color: #2d5a27;
      color: #ffffff;
      padding: 3rem 1rem;
      text-align: center;
    }
    header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    header p {
      font-size: 1rem;
      opacity: 0.9;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: #ffffff;
      border-radius: 8px;
      padding: 2rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h2 {
      color: #2d5a27;
      border-bottom: 2px solid #e0ebd8;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      font-size: 1.4rem;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.85rem;
      color: #777777;
    }

    /* --- パスワード保護オーバーレイ用スタイル --- */
    #lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #1e2922;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999999;
      padding: 1.5rem;
      text-align: center;
    }
    .lock-box {
      background: #28392f;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }
    .lock-box h2 {
      font-size: 1.3rem;
      margin-bottom: 0.8rem;
    }
    .lock-box p {
      font-size: 0.9rem;
      color: #b0c2b6;
      margin-bottom: 1.5rem;
    }
    .lock-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #486352;
      border-radius: 6px;
      background: #1a251e;
      color: #ffffff;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }
    .lock-input:focus {
      border-color: #52a468;
    }
    .lock-btn {
      width: 100%;
      padding: 0.75rem;
      background-color: #3b7b4a;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .lock-btn:hover {
      background-color: #49995c;
    }
    #lock-error {
      color: #ff7b7b;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      display: none;
    }
  </style>
</head>
<body>

  <!-- パスワード認証オーバーレイ -->
  <div id="lock-screen">
    <div class="lock-box">
      <h2>閲覧制限</h2>
      <p>このサイトを閲覧するには合言葉（パスワード）を入力してください。</p>
      <input type="password" id="password-input" class="lock-input" placeholder="合言葉を入力" autofocus>
      <button onclick="checkPassword()" class="lock-btn">サイトを表示する</button>
      <p id="lock-error">パスワードが正しくありません。</p>
    </div>
  </div>

  <!-- サイト本体コンテンツ -->
  <header>
    <h1>合同会社くじやま</h1>
    <p>植物栽培・原木きのこ・アウトドアフィールドの創造</p>
  </header>

  <main>
    <section class="card">
      <h2>くじやまフィールドについて</h2>
      <p>自然の恵みを生かした花卉・山野草の栽培、原木栽培、アウトドアフィールドの整備を行っています。現在、本格オープンに向けてサイトを準備中です。</p>
    </section>

    <section class="card">
      <h2>事業案内</h2>
      <p>ドライフラワー・クラフト素材の栽培、原木シイタケ等の育成、およびフィールド運営を展開してまいります。</p>
    </section>
  </main>

  <footer>
    <p>&copy; 合同会社くじやま All Rights Reserved.</p>
  </footer>

  <!-- 認証スクリプト -->
  <script>
    // ここでパスワード（合言葉）を指定します（お好きな文字列に変更してください）
    const CORRECT_PW = "kujiyama2026";

    // 既に認証済みかチェック
    if (sessionStorage.getItem("kujiyama_authorized") === "true") {
      document.getElementById("lock-screen").style.display = "none";
    }

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      const errorMsg = document.getElementById("lock-error");

      if (input === CORRECT_PW) {
        // 正解の場合はフラグを保存してロック画面を非表示にする
        sessionStorage.setItem("kujiyama_authorized", "true");
        document.getElementById("lock-screen").style.display = "none";
      } else {
        // 不正解の場合はエラー表示
        errorMsg.style.display = "block";
      }
    }

    // Enterキーでも送信できるようにする
    document.getElementById("password-input").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>

</body>
</html>
